<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Playground</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
  <div class="col-lg-8 mx-auto p-4 py-md-5">
    <div class="input-group">
      <span class="input-group-text">System Message: </span>
      <textarea id="systemMessageText" class="form-control" aria-label="With textarea">
        You are my assistant
      </textarea>
    </div>
    <div>
      <button id="startConversationButton" style="display: none;">Start new conversation</button>
    </div>

    <div id="messagesDisplay" class="list-group list-group-flush">
    </div>

    <div class="input-group mb-3">
      <input type="text" class="form-control" placeholder="Message" id="userMessage">
      <button class="btn btn-outline-secondary" type="button" id="sendMessage">
        <span id="statusSpinner" class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="display: none"></span>
        Send Message
      </button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script type="text/javascript" src="./app.js"></script>
</body>
</html>
