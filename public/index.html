<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Playground</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
  <div class="col-lg-8 mx-auto p-4 py-md-5">
    <div class="input-group">
      <span class="input-group-text">System Message: </span>
      <textarea id="systemMessageText" class="form-control" aria-label="With textarea">
        You are a helpful, respectful and honest assistant named &quot;Parasol Assistant&quot;.
  You will be given a claim summary, references to provide you with information, and a question. You must answer the question based as much as possible on this claim with the help of the references.
  Always answer as helpfully as possible, while being safe. Your answers should not include any harmful, unethical, racist, sexist, toxic, dangerous, or illegal content. Please ensure that your responses are socially unbiased and positive in nature.
  
  If a question does not make any sense, or is not factually coherent, explain why instead of answering something not correct. If you don't know the answer to a question, please don't share false information.
  
  You must answer in 4 sentences or less.
  
  Don't make up policy term limits by yourself.
      </textarea>
    </div>
    <div>
      <button id="startConversationButton" style="display: none;">Start new conversation</button>
    </div>

    <div id="messagesDisplay" class="list-group list-group-flush">
    </div>

    <div class="input-group mb-3">
      <input type="text" class="form-control" placeholder="Message" id="userMessage">
      <button class="btn btn-outline-secondary" type="button" id="sendMessage">
        <span id="statusSpinner" class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="display: none"></span>
        Send Message
      </button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script type="text/javascript" src="./app.js"></script>
</body>
</html>
